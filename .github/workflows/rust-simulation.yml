name: Rust simulation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Generate Rust JSONL run log
        run: >-
          cargo run --
          --strategy aggressive
          --seed 424242
          --width 24
          --height 18
          --max-turns 120
          --output /tmp/anarogue-rust.jsonl

      - name: Upload Rust JSONL run log
        uses: actions/upload-artifact@v4
        with:
          name: anarogue-rust-log
          path: /tmp/anarogue-rust.jsonl
