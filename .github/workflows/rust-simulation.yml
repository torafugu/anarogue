name: Rust simulation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Test comparison metrics, SQLite API and Rust persistence
        env:
          ANAROGUE_RUST_BINARY: ${{ github.workspace }}/simulation-core/target/debug/anarogue-sim
        run: |
          test -x target/debug/anarogue-sim
          python3 -m unittest discover -s ../tools -p 'test_*.py'

      - name: Download Godot 4.5 for launcher integration
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/anarogue-godot
          chmod +x /tmp/anarogue-godot/Godot_v4.5-stable_linux.x86_64

      - name: Verify Godot Run launcher with Rust and SQLite API
        env:
          GODOT: /tmp/anarogue-godot/Godot_v4.5-stable_linux.x86_64
          ANAROGUE_RUST_BINARY: ${{ github.workspace }}/simulation-core/target/debug/anarogue-sim
        run: python3 ../tools/test_run_launcher_api.py

      - name: Reproduce 50-seed strategy comparison
        run: |
          cargo build --release
          python3 ../tools/compare_strategies.py --binary target/release/anarogue-sim --output-dir /tmp/anarogue-comparison
          diff -r ../examples/comparison-v8 /tmp/anarogue-comparison

      - name: Generate Rust JSONL run log
        run: >-
          cargo run --
          --strategy aggressive
          --seed 424242
          --width 24
          --height 18
          --max-turns 120
          --output /tmp/anarogue-rust.jsonl

      - name: Upload Rust JSONL run log
        uses: actions/upload-artifact@v4
        with:
          name: anarogue-rust-log
          path: /tmp/anarogue-rust.jsonl
