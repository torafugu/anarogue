name: Godot tests

on:
  push:
  pull_request:

jobs:
  fixed-seed-regression:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run fixed-seed regression tests
        run: >-
          godot --headless --path game
          --script res://tests/fixed_seed_regression.gd

      - name: Verify portable random-number vectors
        run: >-
          godot --headless --path game
          --script res://tests/portable_rng_test.gd

      - name: Verify simulation v2 floor and terminal rules
        run: >-
          godot --headless --path game
          --script res://tests/simulation_v2_test.gd

      - name: Verify items, healing and item replay
        run: >-
          godot --headless --path game
          --script res://tests/items_test.gd

      - name: Verify navigation cycle recovery
        run: >-
          godot --headless --path game
          --script res://tests/navigation_test.gd

      - name: Verify equipment and damage
        run: >-
          godot --headless --path game
          --script res://tests/equipment_test.gd

      - name: Verify growth and descent decisions
        run: >-
          godot --headless --path game
          --script res://tests/growth_test.gd

      - name: Verify Player bows and weapon preferences
        run: >-
          godot --headless --path game
          --script res://tests/bow_test.gd

      - name: Verify Archer line of sight
        run: >-
          godot --headless --path game
          --script res://tests/line_of_sight_test.gd

      - name: Regenerate fixed-seed reference logs
        run: >-
          godot --headless --path game
          --script res://tools/generate_reference_logs.gd

      - name: Verify reference logs are reproducible
        run: sha256sum -c examples/reference-v6/checksums-v6.sha256

      - name: Verify Godot replay data
        run: >-
          godot --headless --path game
          --script res://tests/replay_log_test.gd

      - name: Verify replay result popups
        run: >-
          godot --headless --path game
          --script res://tests/replay_popup_test.gd

      - name: Run headless simulation smoke test
        run: >-
          godot --headless --path game
          --script res://tools/headless_run.gd
          --output /tmp/anarogue-headless.jsonl --
          --strategy cautious
          --seed 424242
          --max-turns 100

      - name: Check headless event log
        run: |
          test -s /tmp/anarogue-headless.jsonl
          grep -q '"event":"run_start"' /tmp/anarogue-headless.jsonl
          grep -q '"event":"decision"' /tmp/anarogue-headless.jsonl
