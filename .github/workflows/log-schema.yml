name: Log schema

on:
  push:
  pull_request:

jobs:
  validate-jsonl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate sample run log
        run: npm run validate:logs

      - name: Build log viewer
        run: npm run build
