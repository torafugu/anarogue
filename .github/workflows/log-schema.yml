name: Log schema

on:
  push:
  pull_request:

jobs:
  validate-jsonl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate sample run log
        run: npm run validate:logs

      - name: Validate fixed-seed reference logs
        run: npm run validate:logs -- ../examples/reference/*.jsonl

      - name: Validate simulation v2 reference logs
        run: npm run validate:logs -- ../examples/reference-v2/*.jsonl

      - name: Build a Rust JSONL run log
        working-directory: simulation-core
        run: >-
          cargo run --
          --strategy aggressive
          --seed 424242
          --max-turns 120
          --output /tmp/anarogue-rust.jsonl

      - name: Validate Rust JSONL run log
        run: npm run validate:logs -- /tmp/anarogue-rust.jsonl

      - name: Build log viewer
        run: npm run build
