[package]
name = "anarogue-simulation"
version = "0.1.0"
edition = "2021"
description = "Godot-independent deterministic simulation core for AnaRogue"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
same-file = "1"

[lib]
name = "anarogue_simulation"
path = "src/lib.rs"

[[bin]]
name = "anarogue-sim"
path = "src/main.rs"
